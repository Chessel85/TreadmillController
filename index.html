<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treadmill Controller — Manticore</title>
    <style>
        :root { color-scheme: light; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            background: #fff;
            color: #111;
        }
        h1 { font-size: 1.4rem; }
        button {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
            border: 3px solid #000;
            border-radius: 12px;
            background: #f8f8f8;
        }
        button:disabled { opacity: 0.5; }
        #connectButton { background: #e7f3ff; }
        #status {
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            background: #f0f0f0;
        }
        fieldset {
            border: 3px solid #333;
            border-radius: 12px;
            padding: 12px;
            margin: 16px 0;
        }
        fieldset:disabled { opacity: 0.5; }
        legend { font-weight: bold; padding: 0 6px; }
        .mode-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 8px;
            font-size: 1.1rem;
        }
        .mode-option input {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0;
            margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;
        }
        #plannedNotice {
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            padding: 14px;
            border-radius: 8px;
            background: #fff3cd;
        }
        #recoveredSessionNotice {
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            padding: 14px;
            border-radius: 8px;
            background: #e7f3ff;
        }
        .timer-display {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            border: 3px solid #333;
            border-radius: 15px;
            padding: 16px 0;
            margin: 16px 0;
        }
        .button-row {
            display: flex;
            gap: 10px;
        }
        .button-row button { flex: 1; }
        #telemetryDisplay {
            text-align: center;
            margin: 10px 0;
            color: #444;
        }
    </style>
</head>
<body>
    <h1>Treadmill Controller — Manticore</h1>

    <div id="status" role="status">Not connected</div>

    <div id="recoveredSessionNotice" role="status" hidden></div>
    <button id="discardSavedSessionButton" type="button" hidden>Discard saved session</button>

    <button id="connectButton" type="button">Connect to treadmill</button>

    <fieldset id="modeFieldset" disabled>
        <legend>Choose session mode</legend>
        <label class="mode-option">
            <input type="radio" name="mode" id="modeManual" value="manual">
            Manual mode — I control speed and incline on the treadmill; the app only logs the session.
        </label>
        <label class="mode-option">
            <input type="radio" name="mode" id="modePlanned" value="planned">
            Planned mode — upload a plan and the app drives speed and incline changes.
        </label>
    </fieldset>

    <button id="changeModeButton" type="button" hidden>Change mode</button>

    <div id="plannedNotice" role="status" hidden>Planned mode isn't available yet — plan upload is coming in a future update. Choose Manual mode to start a session now.</div>

    <button id="startButton" type="button" hidden>Start</button>

    <div id="timerContainer" class="timer-display" role="timer" hidden>
        <span id="timerDisplay">0:00</span>
    </div>

    <div id="telemetryDisplay" hidden>Speed: <span id="speedValue">–</span> km/h · Incline: <span id="inclineValue">–</span>%</div>

    <div id="sessionButtonRow" class="button-row" hidden>
        <button id="pauseResumeButton" type="button">Pause</button>
        <button id="finishButton" type="button">Finish</button>
    </div>

    <div id="instructionRegion" aria-live="assertive" class="sr-only"></div>

    <script>
        const statusEl = document.getElementById('status');
        const connectButton = document.getElementById('connectButton');
        const modeFieldset = document.getElementById('modeFieldset');
        const modeRadios = modeFieldset.querySelectorAll('input[name="mode"]');
        const changeModeButton = document.getElementById('changeModeButton');
        const plannedNotice = document.getElementById('plannedNotice');
        const startButton = document.getElementById('startButton');
        const timerContainer = document.getElementById('timerContainer');
        const timerDisplay = document.getElementById('timerDisplay');
        const sessionButtonRow = document.getElementById('sessionButtonRow');
        const pauseResumeButton = document.getElementById('pauseResumeButton');
        const finishButton = document.getElementById('finishButton');
        const telemetryDisplay = document.getElementById('telemetryDisplay');
        const speedValue = document.getElementById('speedValue');
        const inclineValue = document.getElementById('inclineValue');
        const instructionRegion = document.getElementById('instructionRegion');
        const recoveredSessionNotice = document.getElementById('recoveredSessionNotice');
        const discardSavedSessionButton = document.getElementById('discardSavedSessionButton');

        let sessionMode = null; // 'manual' | 'planned'
        let sessionState = 'idle'; // 'idle' | 'running' | 'paused' | 'finished'
        let elapsedSeconds = 0;
        let timerInterval = null;

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        function announce(message) {
            instructionRegion.textContent = '';
            requestAnimationFrame(() => { instructionRegion.textContent = message; });
        }

        function setStatus(message) {
            statusEl.textContent = message;
        }

        // Bluefy's Web Bluetooth implementation doesn't always reject with a
        // standard DOMException, so pull out whatever info is actually there
        // rather than assuming .name/.message exist.
        function describeError(error) {
            let text = String(error);
            try {
                const keys = Object.getOwnPropertyNames(Object(error));
                const details = keys
                    .filter(k => k !== 'stack')
                    .map(k => `${k}=${JSON.stringify(error[k])}`)
                    .join(', ');
                if (details) text += ` (${details})`;
            } catch (e) { /* ignore, text already has the String() fallback */ }
            return text;
        }

        // iConsole+0168 (JTX Sprint 6) proprietary service — see docs/ble-findings.md.
        // FTMS and Device Information are also requested so later phases can read
        // telemetry/control characteristics without a fresh pairing. Full 128-bit
        // UUID strings throughout (rather than the 16-bit hex shorthand like 0x1826)
        // since Bluefy's Web Bluetooth implementation rejected requestDevice() with a
        // bare error code 2 when short numeric UUIDs were used — full strings avoid
        // relying on it to auto-expand them.
        const ICONSOLE_SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
        const FTMS_SERVICE_UUID = '00001826-0000-1000-8000-00805f9b34fb';
        const DEVICE_INFO_SERVICE_UUID = '0000180a-0000-1000-8000-00805f9b34fb';
        const TREADMILL_DATA_CHARACTERISTIC_UUID = '00002acd-0000-1000-8000-00805f9b34fb';

        let device = null;
        let gattServer = null;
        let treadmillDataChar = null;
        let telemetryAvailable = false;
        let lastReading = null;
        let lastLoggedReading = null;
        let sessionLog = []; // [{ atSeconds, speedKmh, inclinePercent }, ...] — logged only while running (PDD Ref #5)

        // Local session storage (PDD-adjacent Phase 2.3): the in-progress/finished
        // session is written to localStorage as it changes, independent of the
        // in-memory UI state, so a dropped BLE connection or accidental reload
        // doesn't silently lose logged data. Actually *resuming* a saved session
        // into a live UI is Phase 5.2 — this just makes sure nothing is lost until
        // then, and surfaces a summary on next page load so the user knows it's there.
        const SESSION_STORAGE_KEY = 'treadmillSession';

        function saveSessionToStorage() {
            if (sessionState === 'idle') return;
            try {
                localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
                    mode: sessionMode,
                    state: sessionState,
                    elapsedSeconds,
                    sessionLog,
                    savedAt: new Date().toISOString()
                }));
            } catch (error) {
                console.error('Failed to save session to localStorage', error);
            }
        }

        function clearSavedSession() {
            try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (error) { /* ignore */ }
            recoveredSessionNotice.hidden = true;
            recoveredSessionNotice.textContent = '';
            discardSavedSessionButton.hidden = true;
        }

        function checkForSavedSession() {
            let saved;
            try {
                const raw = localStorage.getItem(SESSION_STORAGE_KEY);
                if (!raw) return;
                saved = JSON.parse(raw);
            } catch (error) {
                return;
            }
            if (!saved || !Array.isArray(saved.sessionLog)) return;

            const durationText = formatTime(saved.elapsedSeconds || 0);
            const pointCount = saved.sessionLog.length;
            const modeName = saved.mode === 'planned' ? 'Planned' : 'Manual';
            const message = `Found a saved ${modeName.toLowerCase()} session from a previous visit: ${durationText}, ${pointCount} telemetry point${pointCount === 1 ? '' : 's'} logged. Strava upload for saved sessions is coming in a later update — it will stay saved until you discard it.`;
            recoveredSessionNotice.textContent = message;
            recoveredSessionNotice.hidden = false;
            discardSavedSessionButton.hidden = false;
        }

        discardSavedSessionButton.addEventListener('click', () => {
            clearSavedSession();
            announce('Saved session discarded.');
        });

        // Decodes the FTMS Treadmill Data characteristic (Bluetooth SIG GATT spec,
        // 0x2ACD). Only Instantaneous Speed and Inclination are extracted — other
        // optional fields (average speed, total distance, etc.) are still walked
        // over in spec order so the byte offset lands correctly on Inclination.
        function decodeTreadmillData(dataView) {
            let offset = 0;
            const flags = dataView.getUint16(offset, true); offset += 2;

            const moreDataOnly = (flags & 0x0001) !== 0; // bit0 is inverted: 0 means Instantaneous Speed IS present
            const avgSpeedPresent = (flags & 0x0002) !== 0;
            const totalDistancePresent = (flags & 0x0004) !== 0;
            const inclinePresent = (flags & 0x0008) !== 0;

            const reading = {};

            if (!moreDataOnly && offset + 2 <= dataView.byteLength) {
                reading.speedKmh = dataView.getUint16(offset, true) * 0.01;
                offset += 2;
            }
            if (avgSpeedPresent) offset += 2;
            if (totalDistancePresent) offset += 3;
            if (inclinePresent && offset + 2 <= dataView.byteLength) {
                reading.inclinePercent = dataView.getInt16(offset, true) * 0.1;
                offset += 2; // ramp angle setting follows, not needed
            }

            return reading;
        }

        function updateTelemetryDisplay(reading) {
            telemetryDisplay.hidden = false;
            if (reading.speedKmh !== undefined) speedValue.textContent = reading.speedKmh.toFixed(1);
            if (reading.inclinePercent !== undefined) inclineValue.textContent = reading.inclinePercent.toFixed(1);
        }

        function handleTreadmillData(event) {
            const reading = decodeTreadmillData(event.target.value);
            lastReading = reading;
            updateTelemetryDisplay(reading);

            if (sessionState !== 'running') return;
            const changed = !lastLoggedReading
                || reading.speedKmh !== lastLoggedReading.speedKmh
                || reading.inclinePercent !== lastLoggedReading.inclinePercent;
            if (changed) {
                sessionLog.push({ atSeconds: elapsedSeconds, speedKmh: reading.speedKmh, inclinePercent: reading.inclinePercent });
                lastLoggedReading = reading;
                saveSessionToStorage();
            }
        }

        async function subscribeToTelemetry() {
            try {
                const ftmsService = await gattServer.getPrimaryService(FTMS_SERVICE_UUID);
                treadmillDataChar = await ftmsService.getCharacteristic(TREADMILL_DATA_CHARACTERISTIC_UUID);
                await treadmillDataChar.startNotifications();
                treadmillDataChar.addEventListener('characteristicvaluechanged', handleTreadmillData);
                telemetryAvailable = true;
            } catch (error) {
                // Non-fatal per PDD Ref #5: fall back to duration-only logging if
                // telemetry isn't readable.
                console.error('Telemetry subscription failed', error);
                telemetryAvailable = false;
            }
        }

        function setConnectButtonState(state) {
            if (state === 'idle') {
                connectButton.disabled = false;
                connectButton.textContent = 'Connect to treadmill';
            } else if (state === 'busy') {
                connectButton.disabled = true;
            } else if (state === 'connected') {
                connectButton.disabled = true;
                connectButton.textContent = 'Connected';
            }
        }

        function resetSessionUI() {
            clearInterval(timerInterval);
            timerInterval = null;
            sessionState = 'idle';
            elapsedSeconds = 0;
            timerDisplay.textContent = formatTime(0);
            timerContainer.hidden = true;
            sessionButtonRow.hidden = true;
            pauseResumeButton.textContent = 'Pause';
            sessionLog = [];
            lastLoggedReading = null;
        }

        function resetModeSelection() {
            modeFieldset.disabled = true;
            modeRadios.forEach(r => { r.disabled = false; r.checked = false; });
            changeModeButton.hidden = true;
            startButton.hidden = true;
            plannedNotice.hidden = true;
            sessionMode = null;
            resetSessionUI();
        }

        function onDisconnected() {
            gattServer = null;
            treadmillDataChar = null;
            telemetryAvailable = false;
            lastReading = null;
            telemetryDisplay.hidden = true;
            setConnectButtonState('idle');
            resetModeSelection();
            setStatus('Not connected');
            announce('Treadmill disconnected.');
        }

        connectButton.addEventListener('click', async () => {
            setConnectButtonState('busy');
            setStatus('Scanning for treadmill…');
            announce('Scanning for treadmill.');

            try {
                device = await navigator.bluetooth.requestDevice({
                    // Filtered by name so the device picker shows only the treadmill —
                    // acceptAllDevices was a temporary diagnostic step (see Kraken in
                    // IMPLEMENTATION_PLAN.md's Session Log) to rule out filter-matching
                    // while the real bug (short numeric UUIDs below) was being found.
                    filters: [{ namePrefix: 'iConsole' }],
                    optionalServices: [ICONSOLE_SERVICE_UUID, FTMS_SERVICE_UUID, DEVICE_INFO_SERVICE_UUID]
                });
            } catch (error) {
                console.error('requestDevice failed', error);
                setConnectButtonState('idle');
                const message = error && error.name === 'NotFoundError'
                    ? 'No treadmill selected.'
                    : `Scan failed: ${describeError(error)}`;
                setStatus(message);
                announce(message);
                return;
            }

            const deviceName = device.name || 'treadmill';
            setStatus(`Found ${deviceName}. Connecting…`);
            announce(`Found ${deviceName}. Connecting.`);
            device.addEventListener('gattserverdisconnected', onDisconnected);

            try {
                gattServer = await device.gatt.connect();
            } catch (error) {
                console.error('gatt.connect failed', error);
                setConnectButtonState('idle');
                const message = `Could not connect to ${deviceName}: ${describeError(error)}`;
                setStatus(message);
                announce(message);
                return;
            }

            setConnectButtonState('connected');
            modeFieldset.disabled = false;
            setStatus(`Connected to ${deviceName}. Choose a session mode.`);
            announce(`Connected to ${deviceName}. Choose a session mode.`);

            await subscribeToTelemetry();
        });

        if (!navigator.bluetooth) {
            connectButton.disabled = true;
            setStatus('Web Bluetooth is not available in this browser.');
        }

        checkForSavedSession();

        modeRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (!radio.checked) return;
                modeRadios.forEach(r => { r.disabled = true; });
                changeModeButton.hidden = false;
                sessionMode = radio.value;
                const modeName = sessionMode === 'manual' ? 'Manual mode' : 'Planned mode';
                if (sessionMode === 'manual') {
                    plannedNotice.hidden = true;
                    startButton.hidden = false;
                    setStatus(`Connected. ${modeName} selected. Ready to start.`);
                    announce(`${modeName} selected. Ready to start.`);
                } else {
                    startButton.hidden = true;
                    plannedNotice.hidden = false;
                    setStatus(`Connected. ${modeName} selected.`);
                    announce(`${modeName} selected. Plan upload is not available yet.`);
                }
            });
        });

        changeModeButton.addEventListener('click', () => {
            // Per PDD Ref #2, mode selection is locked once a session starts and can only be
            // changed once that session is cancelled or ended — enforced by hiding this
            // button for the duration of the session (see startButton/finishButton handlers).
            modeRadios.forEach(r => { r.disabled = false; r.checked = false; });
            changeModeButton.hidden = true;
            startButton.hidden = true;
            plannedNotice.hidden = true;
            sessionMode = null;
            setStatus('Connected. Choose a session mode.');
            announce('Mode selection unlocked.');
        });

        startButton.addEventListener('click', () => {
            clearSavedSession(); // starting fresh — any old saved session is now superseded

            sessionState = 'running';
            elapsedSeconds = 0;
            timerDisplay.textContent = formatTime(0);
            changeModeButton.hidden = true;
            startButton.hidden = true;
            timerContainer.hidden = false;
            sessionButtonRow.hidden = false;
            pauseResumeButton.textContent = 'Pause';

            sessionLog = [];
            lastLoggedReading = null;
            if (lastReading) {
                sessionLog.push({ atSeconds: 0, speedKmh: lastReading.speedKmh, inclinePercent: lastReading.inclinePercent });
                lastLoggedReading = lastReading;
            }

            timerInterval = setInterval(() => {
                elapsedSeconds++;
                timerDisplay.textContent = formatTime(elapsedSeconds);
                saveSessionToStorage();
            }, 1000);

            saveSessionToStorage();
            setStatus('Session running.');
            announce('Session started.');
        });

        pauseResumeButton.addEventListener('click', () => {
            if (sessionState === 'running') {
                sessionState = 'paused';
                clearInterval(timerInterval);
                pauseResumeButton.textContent = 'Resume';
                saveSessionToStorage();
                setStatus('Session paused.');
                announce('Session paused.');
            } else if (sessionState === 'paused') {
                sessionState = 'running';
                timerInterval = setInterval(() => {
                    elapsedSeconds++;
                    timerDisplay.textContent = formatTime(elapsedSeconds);
                    saveSessionToStorage();
                }, 1000);
                pauseResumeButton.textContent = 'Pause';
                saveSessionToStorage();
                setStatus('Session running.');
                announce('Session resumed.');
            }
        });

        finishButton.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
            sessionState = 'finished';
            saveSessionToStorage();
            const durationText = formatTime(elapsedSeconds);
            sessionButtonRow.hidden = true;
            startButton.hidden = sessionMode !== 'manual';
            changeModeButton.hidden = false;
            let message = `Session finished. Duration: ${durationText}.`;
            if (telemetryAvailable) {
                message += ` ${sessionLog.length} telemetry point${sessionLog.length === 1 ? '' : 's'} logged.`;
            }
            setStatus(message);
            announce(message);
        });
    </script>
</body>
</html>
