<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treadmill Controller — Wyvern</title>
    <style>
        :root { color-scheme: light; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            background: #fff;
            color: #111;
        }
        h1 { font-size: 1.4rem; }
        button {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
            border: 3px solid #000;
            border-radius: 12px;
            background: #f8f8f8;
        }
        button:disabled { opacity: 0.5; }
        #connectButton { background: #e7f3ff; }
        #status {
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            background: #f0f0f0;
        }
        fieldset {
            border: 3px solid #333;
            border-radius: 12px;
            padding: 12px;
            margin: 16px 0;
        }
        fieldset:disabled { opacity: 0.5; }
        legend { font-weight: bold; padding: 0 6px; }
        .mode-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 8px;
            font-size: 1.1rem;
        }
        .mode-option input {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0;
            margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;
        }
    </style>
</head>
<body>
    <h1>Treadmill Controller — Wyvern</h1>

    <div id="status" role="status">Not connected</div>

    <button id="connectButton" type="button">Connect to treadmill</button>

    <fieldset id="modeFieldset" disabled>
        <legend>Choose session mode</legend>
        <label class="mode-option">
            <input type="radio" name="mode" id="modeManual" value="manual">
            Manual mode — I control speed and incline on the treadmill; the app only logs the session.
        </label>
        <label class="mode-option">
            <input type="radio" name="mode" id="modePlanned" value="planned">
            Planned mode — upload a plan and the app drives speed and incline changes.
        </label>
    </fieldset>

    <button id="changeModeButton" type="button" hidden>Change mode</button>

    <div id="instructionRegion" aria-live="assertive" class="sr-only"></div>

    <script>
        const statusEl = document.getElementById('status');
        const connectButton = document.getElementById('connectButton');
        const modeFieldset = document.getElementById('modeFieldset');
        const modeRadios = modeFieldset.querySelectorAll('input[name="mode"]');
        const changeModeButton = document.getElementById('changeModeButton');
        const instructionRegion = document.getElementById('instructionRegion');

        function announce(message) {
            instructionRegion.textContent = '';
            requestAnimationFrame(() => { instructionRegion.textContent = message; });
        }

        function setStatus(message) {
            statusEl.textContent = message;
        }

        // Bluefy's Web Bluetooth implementation doesn't always reject with a
        // standard DOMException, so pull out whatever info is actually there
        // rather than assuming .name/.message exist.
        function describeError(error) {
            let text = String(error);
            try {
                const keys = Object.getOwnPropertyNames(Object(error));
                const details = keys
                    .filter(k => k !== 'stack')
                    .map(k => `${k}=${JSON.stringify(error[k])}`)
                    .join(', ');
                if (details) text += ` (${details})`;
            } catch (e) { /* ignore, text already has the String() fallback */ }
            return text;
        }

        // iConsole+0168 (JTX Sprint 6) proprietary service — see docs/ble-findings.md.
        // FTMS and Device Information are also requested so later phases can read
        // telemetry/control characteristics without a fresh pairing. Full 128-bit
        // UUID strings throughout (rather than the 16-bit hex shorthand like 0x1826)
        // since Bluefy's Web Bluetooth implementation rejected requestDevice() with a
        // bare error code 2 when short numeric UUIDs were used — full strings avoid
        // relying on it to auto-expand them.
        const ICONSOLE_SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
        const FTMS_SERVICE_UUID = '00001826-0000-1000-8000-00805f9b34fb';
        const DEVICE_INFO_SERVICE_UUID = '0000180a-0000-1000-8000-00805f9b34fb';

        let device = null;
        let gattServer = null;

        function setConnectButtonState(state) {
            if (state === 'idle') {
                connectButton.disabled = false;
                connectButton.textContent = 'Connect to treadmill';
            } else if (state === 'busy') {
                connectButton.disabled = true;
            } else if (state === 'connected') {
                connectButton.disabled = true;
                connectButton.textContent = 'Connected';
            }
        }

        function resetModeSelection() {
            modeFieldset.disabled = true;
            modeRadios.forEach(r => { r.disabled = false; r.checked = false; });
            changeModeButton.hidden = true;
        }

        function onDisconnected() {
            gattServer = null;
            setConnectButtonState('idle');
            resetModeSelection();
            setStatus('Not connected');
            announce('Treadmill disconnected.');
        }

        connectButton.addEventListener('click', async () => {
            setConnectButtonState('busy');
            setStatus('Scanning for treadmill…');
            announce('Scanning for treadmill.');

            try {
                device = await navigator.bluetooth.requestDevice({
                    // Filtered by name so the device picker shows only the treadmill —
                    // acceptAllDevices was a temporary diagnostic step (see Kraken in
                    // IMPLEMENTATION_PLAN.md's Session Log) to rule out filter-matching
                    // while the real bug (short numeric UUIDs below) was being found.
                    filters: [{ namePrefix: 'iConsole' }],
                    optionalServices: [ICONSOLE_SERVICE_UUID, FTMS_SERVICE_UUID, DEVICE_INFO_SERVICE_UUID]
                });
            } catch (error) {
                console.error('requestDevice failed', error);
                setConnectButtonState('idle');
                const message = error && error.name === 'NotFoundError'
                    ? 'No treadmill selected.'
                    : `Scan failed: ${describeError(error)}`;
                setStatus(message);
                announce(message);
                return;
            }

            const deviceName = device.name || 'treadmill';
            setStatus(`Found ${deviceName}. Connecting…`);
            announce(`Found ${deviceName}. Connecting.`);
            device.addEventListener('gattserverdisconnected', onDisconnected);

            try {
                gattServer = await device.gatt.connect();
            } catch (error) {
                console.error('gatt.connect failed', error);
                setConnectButtonState('idle');
                const message = `Could not connect to ${deviceName}: ${describeError(error)}`;
                setStatus(message);
                announce(message);
                return;
            }

            setConnectButtonState('connected');
            modeFieldset.disabled = false;
            setStatus(`Connected to ${deviceName}. Choose a session mode.`);
            announce(`Connected to ${deviceName}. Choose a session mode.`);
        });

        if (!navigator.bluetooth) {
            connectButton.disabled = true;
            setStatus('Web Bluetooth is not available in this browser.');
        }

        modeRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (!radio.checked) return;
                modeRadios.forEach(r => { r.disabled = true; });
                changeModeButton.hidden = false;
                const modeName = radio.value === 'manual' ? 'Manual mode' : 'Planned mode';
                setStatus(`Connected. ${modeName} selected.`);
                announce(`${modeName} selected.`);
            });
        });

        changeModeButton.addEventListener('click', () => {
            // Per PDD Ref #2, mode selection is locked once a session starts and can only be
            // changed once that session is cancelled or ended. Session start/end doesn't exist
            // yet (Phase 2), so for now this button just unlocks selection again.
            modeRadios.forEach(r => { r.disabled = false; r.checked = false; });
            changeModeButton.hidden = true;
            setStatus('Connected. Choose a session mode.');
            announce('Mode selection unlocked.');
        });
    </script>
</body>
</html>
